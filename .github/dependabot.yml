version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: ["type: maintenance", "area: ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directories:
      - /app/frontend
      - /e2e
    labels: ["type: maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
  - package-ecosystem: docker
    directories:
      - /
      - /app/docker
      - /app/frontend
      - /engine/docker
      - /engine/mcp_server
    labels: ["type: maintenance", "area: ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Bun must match the pinned local and CI tool version; keep same-tag digest updates.
    ignore:
      - dependency-name: oven/bun
        versions: [">1.3.14"]
    groups:
      images:
        patterns: ["*"]
