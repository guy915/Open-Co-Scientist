[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-engine"
version = "1.0.0"
description = "Open LangGraph-based framework for multi-agent research hypothesis generation, adapted from Google Research's AI Co-Scientist."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "research", "hypothesis", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph~=1.2.14",
    "langchain-core~=1.4.7",
    # Bound future major releases while allowing compatible upgrades.
    "langchain-mcp-adapters~=0.3.0",
    # The adapter depends on MCP v1 RequestContext paths; a major upgrade requires coordinated
    # changes.
    "mcp>=1.24.0,<2",
    "litellm~=1.88.6",
    "openai>=2.0,<3",
    "httpx~=0.28.1",
    "typing-extensions~=4.15.0",
    "jsonschema~=4.26.0",
    "pyyaml~=6.0.3",
    # Settings and uploaded-document validation share the server runtime.
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=12.0.0,<13",
    # Spans are no-ops until the API configures an exporter.
    "opentelemetry-api>=1.30,<2",
    # The HTTP server (co_scientist.main and co_scientist.api).
    "fastapi>=0.142.2,<1",
    "starlette>=1.3.1,<2",
    # The standard extra brings uvloop, httptools and watchfiles (--reload).
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    # Required by FastAPI for the multipart UploadFile route in co_scientist.api.runs.
    "python-multipart>=0.0.9",
    # PDF text extraction for uploaded documents.
    "pypdf>=5.0.0,<7.0.0",
    # Encrypts bring-your-own-key provider credentials at rest.
    "cryptography>=43.0.0",
    # Error reports stay off unless SENTRY_DSN is set.
    "sentry-sdk>=2.0.0,<3",
    # Traces stay off unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov>=7.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.21",  # pinned: must match the ruff pin in .github/workflows/ci.yml
    "mypy~=1.19.1",
    "types-PyYAML",
    "types-jsonschema",
    "absl-py~=2.1",
    "requests>=2.32.0,<3",
    "import-linter~=2.15",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["co_scientist*"]

[tool.setuptools.package-data]
co_scientist = [
    "science/prompts/templates/*.md",
    "platform/retrieval/config/*.yaml",
    "domains/chat/data/*.gz",
    "platform/sandbox/*.sbpl",
    "py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C90", # mccabe (cyclomatic complexity)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Load dotenv and configure logging before environment-dependent MCP imports.
"mcp_server/server.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
# Validate settings and wire models with Pydantic's strict typing plugin.
plugins = ["pydantic.mypy"]
# MCP owns independent strict configuration and Biopython overrides.
exclude = ["^(mcp_server|build|dist)/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "yaml", "pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n 4"
