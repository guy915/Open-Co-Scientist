[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist-mcp-server"
version = "0.1.0"
description = "MCP server for Co-Scientist literature review"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "pubmed", "literature-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp~=3.2.0",
    "fastapi~=0.142.2",
    "starlette>=1.3.1,<2",
    "httpx~=0.28.1",
    "defusedxml~=0.7.1",
    "beautifulsoup4~=4.14.3",
    "lxml~=6.1.0",
    "biopython~=1.86",
    "pypdf>=6.16.1,<7",
    "python-dotenv~=1.2.1",
    "uvicorn~=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]


# The package maps to this directory rather than a nested discovery root.
[tool.setuptools]
packages = [
    "mcp_server",
    "mcp_server.tools",
    "mcp_server.tools.lit_review",
]

[tool.setuptools.package-dir]
mcp_server = "."

[tool.setuptools.package-data]
mcp_server = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^(build|dist)/"]

# Biopython advertises typing, but Entrez remains unannotated.
[[tool.mypy.overrides]]
module = ["Bio.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
