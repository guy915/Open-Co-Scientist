    <script>
      (function () {
        var root = document.documentElement;
        var mode = null;
        try {
          mode = localStorage.getItem('cosci-theme');
        } catch (error) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        var path = location.pathname;
        root.dataset.boot = /^\/(runs(\/new)?\/?)?$/.test(path)
          ? 'home'
          : /^\/(chats|examples)\/[^/]/.test(path)
            ? 'chat'
            : /^\/runs\/[^/]/.test(path)
              ? 'report'
              : 'page';
      })();
    </script>
